<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1a1f26" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.6"/>

  <!-- accent ticks top -->
  <g fill="#00d9ff" opacity="0.9">
    <rect x="80" y="60" width="16" height="2"/>
    <rect x="104" y="60" width="2" height="2"/>
    <rect x="112" y="60" width="6" height="2"/>
  </g>

  <!-- meta line -->
  <text x="80" y="98" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7d8590" letter-spacing="3">
    PORTFOLIO · 2026 · SANTO DOMINGO
  </text>

  <!-- name -->
  <text x="76" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#e6edf3" letter-spacing="-2">
    TAMAR PINDER
  </text>

  <!-- accent divider -->
  <rect x="80" y="232" width="64" height="3" fill="#00d9ff" filter="url(#glow)"/>

  <!-- tagline -->
  <text x="80" y="276" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#e6edf3" letter-spacing="4">
    BUILDER · FOUNDER · SHIPPING IN THE CARIBBEAN
  </text>

  <!-- status pill -->
  <g transform="translate(80, 304)">
    <rect width="172" height="24" rx="12" fill="#0a0a0a" stroke="#00d9ff" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#00d9ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#e6edf3" letter-spacing="2">
      OPEN TO BUILDING
    </text>
  </g>

  <!-- right side coordinate / id block -->
  <g transform="translate(1080, 80)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d8590" letter-spacing="2">
      <tspan x="0" y="0">18.4861° N</tspan>
      <tspan x="0" y="18">69.9312° W</tspan>
    </text>
    <line x1="0" y1="36" x2="120" y2="36" stroke="#1a1f26" stroke-width="1"/>
    <text font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d8590" letter-spacing="2">
      <tspan x="0" y="56">DOMINICAN REP.</tspan>
      <tspan x="0" y="74" fill="#00d9ff">ONLINE 16h/d</tspan>
    </text>
  </g>

  <!-- corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 40 40 L 40 64 M 40 40 L 64 40"/>
    <path d="M 1240 40 L 1216 40 M 1240 40 L 1240 64"/>
    <path d="M 40 320 L 40 296 M 40 320 L 64 320"/>
    <path d="M 1240 320 L 1216 320 M 1240 320 L 1240 296"/>
  </g>
</svg>
